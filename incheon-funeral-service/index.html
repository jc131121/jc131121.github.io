
<!-- 서로이음상조 상조서비스 페이지 모바일 디자인 -->
<style>
@media (max-width: 700px) {

  :root {
    --navy: #123b80;
    --navy-dark: #092c69;
    --blue: #1457ee;
    --blue-light: #edf4ff;
    --ink: #24354c;
    --muted: #536780;
    --line: #dbe6f7;
    --bg: #f5f8ff;
  }

  body {
    background: #f5f8ff;
    padding-bottom: 72px;
  }

  .container {
    width: calc(100% - 30px);
  }

  /* 상단 안내 */
  .top-bar {
    background: #092c69;
  }

  .top-bar .container {
    align-items: center;
    gap: 8px;
    padding-top: 8px;
    padding-bottom: 8px;
    font-size: 11px;
  }

  .top-bar a {
    font-size: 11px;
    color: #ffdcac;
  }

  /* 모바일 헤더 */
  .site-header {
    background: #fff;
    border-bottom: 1px solid #dbe6f7;
  }

  .header-inner {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 12px;
    padding-bottom: 12px;
  }

  .brand {
    font-size: 20px;
    color: #123b80;
  }

  .brand img {
    width: 38px;
    height: 38px;
  }

  /* 기존 메뉴를 가로 스크롤형으로 변경 */
  .main-nav {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 8px;
    width: 100%;
    padding: 11px 15px 14px;
    background: #fff;
    border-top: 1px solid #edf1f8;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .main-nav::-webkit-scrollbar {
    display: none;
  }

  .main-nav a {
    flex: 0 0 auto;
    padding: 10px 13px;
    border: 1px solid #d8e5fa;
    border-radius: 10px;
    background: #edf4ff;
    color: #123b80;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
  }

  .main-nav a[aria-current="page"] {
    background: #1457ee;
    border-color: #1457ee;
    color: #fff;
  }

  .breadcrumb {
    padding: 10px 0;
    font-size: 12px;
  }

  /* 메인 배너 */
  .hero {
    background: linear-gradient(
      135deg,
      #0d388d 0%,
      #1457ee 70%,
      #2778ff 100%
    );
    padding: 35px 0 42px;
  }

  .eyebrow {
    display: inline-block;
    padding: 5px 11px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 30px;
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: 12px;
  }

  .hero h1 {
    font-size: 28px;
    line-height: 1.45;
    letter-spacing: -1px;
    margin-bottom: 15px;
  }

  .hero h1 span {
    color: #ffe09c;
  }

  .hero-description {
    color: #edf4ff;
    font-size: 14px;
    line-height: 1.85;
  }

  .hero-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 20px;
  }

  .hero-actions .btn {
    width: 100%;
    min-height: 50px;
    padding: 10px 8px;
    font-size: 12px;
    border-radius: 11px;
  }

  .hero-actions .btn-light {
    background: #fff;
    color: #1457ee;
  }

  .hero-actions .btn-outline-light {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.65);
    color: #fff;
  }

  /* 본문 */
  .section {
    padding: 42px 0;
  }

  .section-heading {
    margin-bottom: 19px;
  }

  .section-kicker {
    color: #1457ee;
    font-size: 12px;
  }

  .section-heading h2 {
    color: #123b80;
    font-size: 23px;
    line-height: 1.45;
  }

  .section-heading p {
    font-size: 14px;
    line-height: 1.8;
  }

  .grid,
  .steps {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .panel,
  .card,
  .step {
    padding: 21px 18px;
    border: 1px solid #dbe6f7;
    border-radius: 15px;
    box-shadow: 0 3px 14px rgba(17,56,120,.04);
  }

  .panel h3,
  .card h3 {
    color: #123b80;
    font-size: 19px;
  }

  .panel p,
  .card p,
  .step p {
    font-size: 14px;
    line-height: 1.85;
  }

  .card ul,
  .check-list {
    font-size: 14px;
    line-height: 1.85;
  }

  .check-list li {
    padding-bottom: 6px;
  }

  .notice {
    background: #edf4ff;
    border-left: 4px solid #1457ee;
    color: #334e70;
    padding: 17px;
    border-radius: 9px;
  }

  /* 별도 비용 주의 */
  .warning {
    background: #fff4e8;
    border: 1px solid #ffd6ad;
    border-left: 5px solid #f97316;
    padding: 19px 17px;
    border-radius: 12px;
  }

  .warning strong {
    color: #98450e;
    font-size: 16px;
  }

  .warning p {
    color: #735035;
    font-size: 14px;
  }

  /* 99만원 상품 */
  .product-box {
    padding: 24px 19px;
    background: #edf4ff;
    border: 1px solid #ccddff;
    border-radius: 17px;
  }

  .product-box h2 {
    color: #123b80;
    font-size: 23px;
    line-height: 1.45;
  }

  .product-price {
    color: #1457ee;
    font-size: 38px;
    line-height: 1.3;
  }

  .product-price small {
    color: #536780;
    font-size: 12px;
    line-height: 1.7;
  }

  .product-box p {
    font-size: 14px;
  }

  /* 장례 진행 단계 */
  .step-number {
    display: inline-block;
    background: #e7efff;
    padding: 4px 10px;
    border-radius: 7px;
    color: #1457ee;
  }

  .step strong {
    color: #123b80;
    font-size: 18px;
  }

  /* 지역 선택 버튼 */
  .region-links {
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 9px;
  }

  .region-links a {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 55px;
    padding: 12px 7px;
    background: #fff;
    border: 1px solid #cbdcff;
    border-radius: 11px;
    color: #123b80;
    font-size: 13px;
    font-weight: 900;
  }

  /* 버튼 */
  .action-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-top: 19px;
  }

  .action-row .btn {
    width: 100%;
    min-height: 50px;
    border-radius: 11px;
  }

  .btn-primary {
    background: #1457ee;
    color: #fff;
  }

  .btn-primary:hover {
    background: #1044bd;
  }

  .btn-outline {
    background: #fff;
    border: 1px solid #aac4f5;
    color: #123b80;
  }

  /* FAQ */
  .faq-list {
    padding: 5px 18px;
    border-radius: 15px;
  }

  .faq-item {
    padding: 18px 0;
  }

  .faq-item h3 {
    font-size: 15px;
    color: #123b80;
  }

  .faq-item p {
    font-size: 14px;
  }

  /* 서비스 약속 */
  .service-banner {
    padding: 23px 19px;
    background: #edf4ff;
    border: 1px solid #d4e2ff;
    border-radius: 16px;
  }

  .service-banner h2 {
    color: #123b80;
    font-size: 22px;
  }

  .service-banner p {
    font-size: 14px;
  }

  /* 마지막 상담 안내 */
  .final-cta {
    padding: 43px 0;
    background: #123b80;
  }

  .final-cta h2 {
    font-size: 24px;
    line-height: 1.5;
  }

  .final-cta p {
    font-size: 14px;
  }

  .final-cta .btn-light {
    background: #f97316;
    color: #fff;
  }

  /* 하단 회사 정보 */
  .site-footer {
    padding: 32px 0 45px;
    background: #0b1d32;
  }

  .footer-links {
    gap: 10px 15px;
  }

  .site-footer p {
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  /* 주황색 고정 상담 버튼 */
  .mobile-call {
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 100;
    min-height: 54px;
    border-radius: 13px;
    background: #f97316;
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    box-shadow: 0 5px 22px rgba(164,76,13,.25);
  }

  /* 앵커 이동 시 여백 */
  #selection-guide,
  #package-info {
    scroll-margin-top: 16px;
  }
}

@media (max-width: 370px) {
  .hero h1 {
    font-size: 25px;
  }

  .brand {
    font-size: 18px;
  }

  .hero-actions .btn {
    font-size: 11px;
  }
}
</style>
